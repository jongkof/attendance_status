<!--
  prototype shell: the review chrome every prototype starts from.

  Keep this comment in the prototype you grow from here: it is the contract,
  and later turns work from that file rather than from this one.

  Contract (extend product screens; keep the review shell):
  - Product:  .sh-stage contains only end-user product UI. Keep review notes,
               rationale, instructions, and approval controls in conversation.
  - Screens:  <section data-screen="slug" data-title="Label"> inside .sh-stage.
               The selector, arrow keys, and #hash routing build themselves.
               Use one option per product destination or distinct surface,
               named by its product role. Keep baselines, variants, comparison
               labels, steps, indexes, and progress out of names and states.
               Links may use href="#slug".
  - States:   "Default" is automatic. A screen declares only representative
               presets in data-states="Empty,Error". Use natural, screen-specific
               names. Reserve presets for important multi-step results, forced
               data or errors, or materially different structure; keep one-click
               and transient states as interactions. Use data-when="Empty" on
               preset-only elements. Call prototypeShell.setState("Name") on
               entry and setState("Default") on exit, including when repeated
               actions cross a preset condition.
  - Viewport: "vp (m)" cycles full / 390 / 768. The 390 preset is a
               fixed-height, internally scrolling phone frame. Start a
               mobile-first prototype by adding class="sh-vp-390" to <body>
               (or a bootstrap classList.add before the chrome script runs).
  - Pinning:  keep in-frame bars (tab bars, CTAs) inside the phone with
               position: sticky; position: fixed pins to the browser window.
  - Tokens:   replace the project-tokens block with project tokens copied
               verbatim. Map differing names to --background, --foreground, and
               --font afterwards; replace network fonts with a system stack and
               note that substitution. Without a design system, keep this
               palette as the finished style. When the project ships dark
               tokens, copy them under .sh-theme-dark, which the shell sets
               on both the root element and body, so :root.sh-theme-dark and
               body.sh-theme-dark work too. A .dark class or a
               prefers-color-scheme media query copied verbatim would follow
               the reviewer's system instead of the toggle.
  - Theme:    the light / dark switch (t) changes the product surface only.
               It appears only when a .sh-theme-dark rule declares dark tokens,
               so a prototype without them carries no theme control. Prototypes
               always load light; the review bar keeps its own dark styling in
               both themes so it still reads as chrome.
  - Placeholders: .wf-pic stands in for pictures the prototype has no real
               files for. Use real text everywhere text belongs.

  - Chrome:   Keep exactly the screen selector, selected-screen state selector,
               viewport cycle, and theme toggle.

  Self-contained by design: no build, no framework, no network.
-->

<script>
  const stage = document.querySelector('.sh-stage');
  const screens = [...stage.querySelectorAll('[data-screen]')];
  const screenSelect = document.getElementById('sh-screen');
  const stateSelect = document.getElementById('sh-state');
  const vpBtn = document.getElementById('sh-vp');
  const themeCtl = document.getElementById('sh-theme');
  const themeBtns = [...themeCtl.querySelectorAll('button')];
  let current = null;
  let currentStates = [];

  screens.forEach(s => {
    const option = document.createElement('option');
    option.textContent = s.dataset.title || s.dataset.screen;
    option.value = s.dataset.screen;
    screenSelect.append(option);

      option.value = name;

      return head + types + plan + iv;
    }

    let popEl = null;
    function cellEl(n, d) { return tbl.querySelector(`[data-n="${n}"][data-d="${d}"]`) }
    function renderPop(reposition) {
      if (!st.pop) return;
      if (!popEl) { popEl = document.createElement('div'); popEl.setAttribute('role', 'dialog'); root.appendChild(popEl) }
      popEl.className = 'pop list';
      popEl.setAttribute('aria-label', `${st.pop.n} ${label(st.pop.d)} 수정`);
      popEl.innerHTML = popHtml();
      place(popEl, cellEl(st.pop.n, st.pop.d));
      popEl.querySelector('.x').onclick = () => closePop();
    }
    function closePop(silent) {
      if (popEl) { popEl.remove(); popEl = null }
      if (st.pop) { st.pop = null; render() }
      if (!silent) sync();
    }
    function openPop(n, d, expand) {
      clearTip();
      st.pop = { n, d, expand: expand || null };
      render(); renderPop();
      sync();
    }

    function commit(msg, n, d) {
      st.last = msg;
      lastEl.textContent = '방금 바꿈: ' + msg;
      if (quiet) { qn.textContent = '방금 바꿈: ' + msg }
      closePop(true); render();
      const el = cellEl(n, d); if (el) el.classList.add('flash');
      sync();
    }
    function apply(type, part) {
      const { n, d } = st.pop, c = S.get(n, d);
      c.rec = { type, part: part || null }; c.unc = false; c.morning = null;
      commit(`${n} ${label(d)} → ${type}${part ? ' ' + part : ''}`, n, d);
    }

    // ── tips for blocked cells ──
    function clearTip() { if (st.tip) { st.tip.el.remove(); clearTimeout(st.tip.t); st.tip = null } }
    function showTip(el, text) {
      clearTip();
      const t = document.createElement('div'); t.className = 'tip'; t.setAttribute('role', 'status'); t.textContent = text; root.appendChild(t);
      place(t, el);
      st.tip = { el: t, t: setTimeout(() => { clearTip(); sync() }, 3500) };
      sync();
    }

    // ── clicks ──
    tbl.addEventListener('click', e => {
      const el = e.target.closest('.c'); if (!el) return;
      const n = el.dataset.n, d = el.dataset.d, f = face(n, d), c = S.get(n, d);
      if (st.mode) {
        if (f.k !== 'ok') {
          closePop(true);
          return showTip(cellEl(n, d), f.k === 'hol' ? `${HOL[d]} 휴일 칸은 수정할 수 없습니다.` : `${n}은(는) 이 날짜에 소속이 아니라 수정할 수 없습니다.`);
        }
        return openPop(n, d);
      }
      if (f.k !== 'ok' || d > TODAY || c.rec) return;
      if (planOn(c)) { const cur = c.morning || 'remote'; const nx = { remote: 'present', present: 'unconfirmed', unconfirmed: 'remote' }[cur]; c.morning = nx === 'remote' ? null : nx }
      else c.unc = !c.unc;
      render();
    });
    root.addEventListener('click', e => {
      if (!st.pop || !popEl) return;
      const b = e.target.closest('button'); if (!b || !popEl.contains(b)) return;
      const { n, d } = st.pop, c = S.get(n, d);
      if (b.dataset.clear) { c.rec = null; c.unc = false; c.morning = null; return commit(`${n} ${label(d)} → 기록 지움${planOn(c) ? ' (리모트 계획이 다시 보임)' : ''}`, n, d) }
      if (b.dataset.plan) {
        c.plan = b.dataset.plan === 'on' ? 'added' : 'released';
        return commit(`${n} ${label(d)} → 리모트 계획 ${b.dataset.plan === 'on' ? '추가' : '해제'}`, n, d);
      }
      if (b.dataset.iv) { c.iv = b.dataset.iv === 'on'; return commit(`${n} ${label(d)} → 면담 표시 ${c.iv ? '켬' : '끔'}`, n, d) }
      if (b.dataset.part) return apply(b.dataset.type, b.dataset.part);
      if (b.dataset.open) { st.pop.expand = st.pop.expand === b.dataset.type ? null : b.dataset.type; renderPop(); return sync() }
      if (b.dataset.type) return apply(b.dataset.type);
    });
    root.addEventListener('click', e => { st.ci = !!e.target.closest('.pop, .c, .switch, .mbar') }, true);
    document.addEventListener('click', e => {
      if (st.ci) { st.ci = false; return }
      if (!st.pop) return;
      if (!root.isConnected) return;
      closePop();
    });
    addEventListener('keydown', e => { if (e.key === 'Escape' && (st.pop || st.tip)) { clearTip(); closePop() } });
    tw.addEventListener('scroll', () => { if (st.pop) place(popEl, cellEl(st.pop.n, st.pop.d)) });
    addEventListener('resize', () => { if (st.pop && popEl) place(popEl, cellEl(st.pop.n, st.pop.d)) });

    // ── presets ──
    function preset() {
      if (!st.mode) return 'Default';
      if (st.tip) return '수정 불가 칸 안내';
      if (st.pop) {
        if (st.pop.expand) return '반차 구분 고르는 중';
        const i = DAYS.indexOf(st.pop.d);
        if (i === DAYS.length - 1) return '오른쪽 끝 칸 팝업';
        if (i === 0) return '왼쪽 끝 칸 팝업';
        return '팝업 열림';
      }
      return '수정 모드 켬';
    }
    function sync() { if (opts.onSync) opts.onSync(preset()) }
    function applyPreset(name) {
      clearTip();
      if (name === 'Default') return setMode(false, true), sync();
      if (!st.mode) setMode(true, true);
      closePop(true);
      const pick = (n, d, ex) => { openPop(n, d, ex); const el = cellEl(n, d); if (el) el.scrollIntoView({ block: 'nearest', inline: 'center' }); if (popEl) place(popEl, el) };
      if (name === '팝업 열림') pick('정ㅇㅇ', '2026-10-29');
      else if (name === '반차 구분 고르는 중') pick('박ㅇㅇ', '2026-10-30', '반차');
      else if (name === '오른쪽 끝 칸 팝업') pick('오ㅇㅇ', '2026-11-06');
      else if (name === '왼쪽 끝 칸 팝업') pick('이ㅇㅇ', '2026-10-19');
      else if (name === '수정 불가 칸 안내') { const el = cellEl('김ㅇㅇ', '2026-10-28'); el.scrollIntoView({ block: 'nearest', inline: 'center' }); showTip(el, `${HOL['2026-10-28']} 휴일 칸은 수정할 수 없습니다.`) }
      else render();
      sync();
    }
    render();
    return { setMode, applyPreset, preset };
  }
  return { mount };
})();

  const board = Board.mount(document.getElementById('board'), { banner: 'bar', onSync: n => { if (prototypeShell.getState() !== n) prototypeShell.setState(n) } });
  stateSelect.addEventListener('change', () => board.applyPreset(stateSelect.value));
</script>
